name: publish-dashboard

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GIT_SSH_COMMAND: "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes"

    steps:
      - name: Setup SSH keys and config
        env:
          RUNUPDATES_SSH_KEY: ${{ secrets.RUNUPDATES_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$RUNUPDATES_SSH_KEY" > ~/.ssh/id_runupdates
          chmod 600 ~/.ssh/id_runupdates

          # Append, never overwrite
          ssh-keyscan -p 2222 -t ed25519 dad > ~/.ssh/known_host
          cat ~/.ssh/known_host

          cat <<EOF > ~/.ssh/config
          Host dad-runupdates
              HostName dad
              Port 2222
              User runner
              IdentityFile /github/home/.ssh/id_runupdates
              IdentitiesOnly yes
          EOF

      - name: Clone Pages repo
        run: |
          git clone http://doug:${{ secrets.RUNUPDATESTOKEN }}@dad:3000/doug/Pages.git Pages
          cd Pages
          git remote set-url origin http://doug:${{ secrets.RUNUPDATESTOKEN }}@dad:3000/doug/Pages.git
          git ls-remote
      - name: Install rsync
        run: |
          apt-get update && apt-get install -y rsync

      - name: Deploy dashboard via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -F ~/.ssh/config -o IdentitiesOnly=yes" \
            Pages/RunUpdates/ \
            dad-runupdates:/srv/forgejo-pages/RunUpdates/
