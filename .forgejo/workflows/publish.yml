# Description:
#   Publishes Pages content to the local Apache server.
#
# Dependencies:
#   workflow_run -> dashboard
#   workflow_dispatch
#
# Target:
#   /var/www/html/RunUpdates

name: publish-dashboard

on:
  workflow_run:
    workflows: ["create-dashboard"]
    types:
      - completed
  workflow_dispatch:

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest
    env:
      GIT_SSH_COMMAND: "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes"
      RUNUPDATES_SSH_KEY: ${{ secrets.RUNUPDATES_SSH_KEY }}
      RUNUPDATES_TOKEN: ${{ secrets.RUNUPDATESTOKEN }}

    steps:
      - name: Setup SSH keys and config
        run: |
          mkdir -p /github/home/.ssh

          echo "$RUNUPDATES_SSH_KEY" > /github/home/.ssh/id_runupdates
          chmod 600 /github/home/.ssh/id_runupdates

          # Fetch actual host key for dad
          ssh-keyscan -p 2222 -t ed25519 dad >> /github/home/.ssh/known_hosts

          cat /github/home/.ssh/known_hosts

          cat <<EOF > /github/home/.ssh/config
          Host dad
              HostName dad
              Port 2222
              User runner
              IdentityFile /github/home/.ssh/id_runupdates
              IdentitiesOnly yes
              UserKnownHostsFile /github/home/.ssh/known_hosts
          EOF

      - name: Clone Pages repo
        run: |
          git clone http://doug:$RUNUPDATES_TOKEN@dad:3000/doug/Pages.git Pages
          cd Pages
          git remote set-url origin http://doug:$RUNUPDATES_TOKEN@dad:3000/doug/Pages.git

      - name: Deploy dashboard via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes" \
            Pages/RunUpdates/ \
            dad:/srv/forgejo-pages/RunUpdates/

          ssh -F /github/home/.ssh/config dad "ls -l /srv/forgejo-pages/RunUpdates"
