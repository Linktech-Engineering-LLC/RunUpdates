name: publish-dashboard

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GIT_SSH_COMMAND: "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes"

    steps:
      - name: Setup SSH keys and config
        env:
          SSH_PAGES_KEY: ${{ secrets.SSH_PAGES_KEY }}
          RUNUPDATES_SSH_KEY: ${{ secrets.RUNUPDATES_SSH_KEY }}
        run: |
          mkdir -p /github/home/.ssh

          echo "$SSH_PAGES_KEY" > /github/home/.ssh/id_pages
          chmod 600 /github/home/.ssh/id_pages

          echo "$RUNUPDATES_SSH_KEY" > /github/home/.ssh/id_runupdates
          chmod 600 /github/home/.ssh/id_runupdates

          # Append, never overwrite
          cat <<EOF >> /github/home/.ssh/known_hosts
          [dad]:2222 ssh-rsa 
          [dad]:2222 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBB3roT956PKBfI0cmiw+YlYQcutV+UwbK/RSGhbgoHRZfNHW9pjyQLsK1TpNAhlP2YZgLKCSBlbA+Xvy6yihwPk=
          [dad]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICVPET4rtLlJV01hpY0DGJnri53tiUkV+GDs0K6RDtmi
          EOF

          cat <<EOF > /github/home/.ssh/config
          Host dad-pages
              HostName dad
              Port 2222
              User forgejo
              IdentityFile /github/home/.ssh/id_pages
              IdentitiesOnly yes

          Host dad-runupdates
              HostName dad
              Port 2222
              User runner
              IdentityFile /github/home/.ssh/id_runupdates
              IdentitiesOnly yes
          EOF

      - name: Clone Pages repo
        run: |
          git clone http://doug:${{ secrets.RUNUPDATESTOKEN }}@dad:3000/doug/Pages.git Pages
          cd Pages
          git remote set-url origin http://doug:${{ secrets.CI_TOKEN }}@dad:3000/doug/Pages.git

      - name: Install rsync
        run: |
          apt-get update && apt-get install -y rsync

      - name: Deploy dashboard via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes" \
            Pages/RunUpdates/ \
            dad-runupdates:/srv/forgejo-pages/RunUpdates/
