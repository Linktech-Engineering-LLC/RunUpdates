name: publish-dashboard

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GIT_SSH_COMMAND: "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes"

    steps:
      - name: Setup SSH keys and config
        env:
          SSH_PAGES_KEY: ${{ secrets.SSH_PAGES_KEY }}
          RUNUPDATES_SSH_KEY: ${{ secrets.RUNUPDATES_SSH_KEY }}
        run: |
          mkdir -p /github/home/.ssh

          echo "$SSH_PAGES_KEY" > /github/home/.ssh/id_pages
          chmod 600 /github/home/.ssh/id_pages

          echo "$RUNUPDATES_SSH_KEY" > /github/home/.ssh/id_runupdates
          chmod 600 /github/home/.ssh/id_runupdates

          # Append, never overwrite
          echo "dad:2222 SHA256:S8XuCWXWm/lbWk4Ma1T7Fcy+xK902j9Qr2ooX/e6kvQ" >> /github/home/.ssh/known_hosts

          cat <<EOF > /github/home/.ssh/config
          Host dad-pages
              HostName dad
              Port 2222
              User forgejo
              IdentityFile /github/home/.ssh/id_pages
              IdentitiesOnly yes

          Host dad-runupdates
              HostName dad
              Port 2222
              User runner
              IdentityFile /github/home/.ssh/id_runupdates
              IdentitiesOnly yes
          EOF

      - name: Clone Pages repo
        run: |
          git clone ssh://forgejo@dad:2222/doug/Pages.git Pages
          cd Pages
          git remote set-url origin ssh://forgejo@dad:2222/doug/Pages.git

      - name: Install rsync
        run: |
          apt-get update && apt-get install -y rsync

      - name: Deploy dashboard via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes" \
            Pages/RunUpdates/ \
            dad-runupdates:/srv/forgejo-pages/RunUpdates/
