#
# Description:
#   Publishes Pages content to the local Apache server.
#
# Dependencies:
#   workflow_run -> dashboard
#   workflow_dispatch
#
# Target:
#   /var/www/html/RunUpdates

name: publish-dashboard

on:
  workflow_run:
    workflows: ["create-dashboard"]
    types:
      - completed
  workflow_dispatch:

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest
    env:
      FORGEJO_API_ROOT: "http://dad:3000/api/v1/repos/linux/RunUpdates"
      FORGEJO_TOKEN: ${{ secrets.RUNUPDATESTOKEN }}
      FORGEJO_SSH_KEY: ${{ secrets.RUNUPDATES_KEY }}

    steps:
      - name: Setup SSH keys and config
        run: |
          mkdir -p ~/.ssh

          echo "$RUNUPDATES_SSH_KEY" > ~/.ssh/id_runupdates
          chmod 600 ~/.ssh/id_runupdates

          # Fetch actual host key for dad
          ssh-keyscan -p 2222 -t ed25519 dad >> ~/.ssh/known_hosts

          cat ~/.ssh/known_hosts

          cat <<EOF > ~/.ssh/config
          Host dad
              HostName dad
              Port 2222
              User runner
              IdentityFile ~/.ssh/id_runupdates
              IdentitiesOnly yes
              UserKnownHostsFile ~/.ssh/known_hosts
          EOF

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create Dashboard
        run: |
          mkdir -p website
          cp packaging/dashboard/index.html website/
          cp packaging/dashboard/dashboard.js website/
          curl -s -o website/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://dad:3000/Linux/RunUpdates/nightly/"

      - name: Download release assets
        env:
          FORGEJO_API_ROOT: http://dad:3000/api/v1/repos/linux/RunUpdates
        run: |
          mkdir -p website/artifacts

          curl -s \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_ROOT/releases/tags/nightly" \
            > release.json

          jq -r '.assets[] | "\(.name)|\(.browser_download_url)"' release.json |
          while IFS='|' read NAME URL; do
            echo "Downloading $NAME"

            if [ "$NAME" = "metadata.json" ]; then
              curl -L \
                -H "Authorization: token $FORGEJO_TOKEN" \
                "$URL" \
                -o "website/metadata.json"
            else
              curl -L \
                -H "Authorization: token $FORGEJO_TOKEN" \
                "$URL" \
                -o "website/artifacts/$NAME"
            fi
          done

          echo "Website contents:"
          find website -type f | sort

      - name: Verify downloaded assets
        run: |
          echo "Website contents:"
          find website -type f | sort

      - name: Verify metadata
        run: |
          test -f website/metadata.json

      - name: Create destination folders
        run: |
          ssh -F ~/.ssh/config dad \
            "mkdir -p /srv/forgejo-pages/RunUpdates/nightly/artifacts"

      - name: Deploy dashboard
        run: |
          rsync -avz --delete \
            -e "ssh -F $HOME/.ssh/config -o IdentitiesOnly=yes" \
            website/ \
            dad:/srv/forgejo-pages/RunUpdates/nightly

      - name: Verify deployment
        run: |
          ssh -F ~/.ssh/config dad \
            "find /srv/forgejo-pages/RunUpdates/nightly -type f | sort"
