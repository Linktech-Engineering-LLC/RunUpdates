name: publish-dashboard

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH keys and config
        env:
          SSH_PAGES_KEY: ${{ secrets.SSH_PAGES_KEY }}
          RUNUPDATES_SSH_KEY: ${{ secrets.RUNUPDATES_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          # Pages key (forgejo user)
          echo "$SSH_PAGES_KEY" > ~/.ssh/id_pages
          chmod 600 ~/.ssh/id_pages

          # RunUpdates key (runner user)
          echo "$RUNUPDATES_SSH_KEY" > ~/.ssh/id_runupdates
          chmod 600 ~/.ssh/id_runupdates

          # Known hosts
          ssh-keyscan -p 2222 -t ed25519 dad ll>> ~/.ssh/known_hosts

          # SSH config for both identities
          cat <<EOF > ~/.ssh/config
          Host dad-pages
              HostName dad
              Port 2222
              User forgejo
              IdentityFile ~/.ssh/id_pages
              IdentitiesOnly yes

          Host dad-runupdates
              HostName dad
              Port 2222
              User runner
              IdentityFile ~/.ssh/id_runupdates
              IdentitiesOnly yes
          EOF

      - name: Clone Pages repo
        run: |
          git clone ssh://dad-pages/doug/Pages.git Pages

      - name: Install rsync
        run: |
          apt-get update && apt-get install -y rsync

      - name: Deploy dashboard via rsync
        run: |
          rsync -avz --delete -e "ssh -o IdentitiesOnly=yes" Pages/RunUpdates/ dad-runupdates:/srv/forgejo-pages/RunUpdates/
