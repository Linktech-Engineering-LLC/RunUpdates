on:
  push:
    branches:
      - main
  create:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    container:
      image: dad:3000/linux/leon-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linting tools
        run: |
          apt-get update
          apt-get install -y shellcheck
          python3 -m pip install \
              --break-system-packages \
              ruff black yamllint

      - name: Python compile check
        run: |
          find . -name "*.py" -exec python3 -m py_compile {} \;

      - name: Ruff
        run: |
          ruff check . || true

      - name: Black
        run: |
          black --check . || true

      - name: Yamllint
        run: |
          yamllint . || true

      - name: Shellcheck
        run: |
          find . -name "*.sh" -exec shellcheck {} \; || true

  sync_to_remote:
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure openssh-client is installed
        run: |
          apt-get update
          apt-get install -y openssh-client

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RUNUPDATES_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add GitHub to known_hosts
        run: |
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Start SSH agent
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Push to Remote Hub
        run: |
          git remote add github ssh://git@github.com/Linktech-Engineering-LLC/RunUpdates.git
          git fetch github main
          git merge --ff-only github/main || echo "Non-fast-forward; skipping merge"
          git push github main
          for tag in $(git tag -l "v*"); do
              git push github "$tag"
          done
