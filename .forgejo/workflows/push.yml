on:
  push:
    branches:
      - main
  create:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    container:
      image: dad:3000/linux/leon-ci:latest

    steps:
      - name: Verify toolchain
        run: |
          python3 --version
          pandoc --version | head -1
          ruff --version
          yamllint --version
          shellcheck --version
          pytest --version
          mypy --version

      - name: Environment diagnostics
        run: |
          which python3
          python3 --version
          pip --version
          python3 -m pip show pyinstaller || true
          uname -a

          python3 -m pip freeze | sort

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PythonTools
        if: ${{ github.event.repository.name != 'PythonTools' }}
        run: |
          pip install git+http://dad:3000/linux/PythonTools.git
      - name: Verify PythonTools
        run: |
          echo "Python executable:"
          which python3

          echo ""
          echo "Installed package:"
          pip show PythonTools || true

          echo ""
          echo "Import test:"
          python3 -c "import PythonTools; print(PythonTools.__file__)"
      - name: Verify PythonTools Submodules
        run: |
          python3 - <<'EOF'
          try:
              from PythonTools.log_helpers.factory import LoggerFactory
              print("log_helpers.factory OK")
          except Exception as e:
              print("log_helpers.factory FAILED:", e)

          try:
              import PythonTools.ansible.helpers
              print("ansible.helpers OK")
          except Exception as e:
              print("ansible.helpers FAILED:", e)

          try:
              import PythonTools.sessions.ssh_sessions
              print("sessions.ssh_sessions OK")
          except Exception as e:
              print("sessions.ssh_sessions FAILED:", e)
          EOF
      - name: Audit PythonTools imports
        run: |
          python3 - <<'EOF'
          MODULES = [
              "PythonTools.log_helpers.factory",
              "PythonTools.ansible.helpers",
              "PythonTools.sessions.ssh_sessions",
              "PythonTools.net",
              "PythonTools.system.events.lifecycle",
              "PythonTools.system.updates.detection",
          ]

          import importlib

          for m in MODULES:
              try:
                  importlib.import_module(m)
                  print(f"OK: {m}")
              except Exception as e:
                  print(f"FAILED: {m}: {e}")
          EOF
      - name: Show PythonTools dependency health
        run: |
          python3 -m pip check || true

      - name: Ruff lint
        if: ${{ hashFiles('**/*.py') != '' }}
        continue-on-error: true
        run: |
          echo "Running Ruff..."
          ruff check . | tee ruff.log || true

      - name: Ruff Format
        if: ${{ hashFiles('**/*.py') != '' }}
        continue-on-error: true
        run: |
          echo "Checking formatting..."
          ruff format --check . | tee ruff-format.log || true

      - name: Ruff Statistics
        if: ${{ hashFiles('**/*.py') != '' }}
        continue-on-error: true
        run: |
          echo ""
          echo "========================================"
          echo "Ruff Statistics"
          echo "========================================"

          ruff check . --statistics || true

      - name: Run yamllint
        if: ${{ hashFiles('**/*.yml', '**/*.yaml') != '' }}
        continue-on-error: true
        run: |
          yamllint -c .yamllint . 2>&1 | tee yamllint.log || true

          ERRORS=$(grep -c "error" yamllint.log || true)
          WARNINGS=$(grep -c "warning" yamllint.log || true)

          echo ""
          echo "Warning Breakdown:"
          grep -o '\[[^]]*\]' yamllint.log | sort | uniq -c || true

      - name: Shellcheck
        if: ${{ hashFiles('**/*.sh') != '' }}
        continue-on-error: true
        run: |
          SH_FILES=$(find . -type f -name "*.sh")

          if [ -z "$SH_FILES" ]; then
              echo "No shell scripts found."
              exit 0
          fi

          shellcheck $SH_FILES 2>&1 | tee shellcheck.log || true

          ERRORS=$(grep -c "(error)" shellcheck.log || true)
          WARNINGS=$(grep -c "(warning)" shellcheck.log || true)
          INFOS=$(grep -c "(info)" shellcheck.log || true)

          echo ""
          echo "========================================"
          echo "ShellCheck Summary"
          echo "========================================"
          echo "Errors:   $ERRORS"
          echo "Warnings: $WARNINGS"
          echo "Infos:    $INFOS"

          echo ""
          echo "Rule Breakdown:"
          grep -o 'SC[0-9]\{4\}' shellcheck.log | \
            sort | uniq -c | sort -rn || true

          echo ""
          echo "Affected Files:"
          grep '^In .* line [0-9]\+:' shellcheck.log | \
            sed 's/^In //' | sed 's/ line.*$//' | \
            sort -u || true

      - name: Pytest
        if: ${{ hashFiles('tests/**/*.py', 'test/**/*.py') != '' }}
        continue-on-error: true
        run: |
          pytest -v

      - name: MyPy
        if: ${{ hashFiles('pyproject.toml') != '' }}
        continue-on-error: true
        run: |
          mypy .

  sync_to_remote:
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RUNUPDATES_GITSSH_KEY }}" >  ~/.ssh/id_ed25519
          chmod 600  ~/.ssh/id_ed25519

      - name: Add GitHub to known_hosts
        run: |
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Start SSH agent
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
      - name: Test GitHub SSH
        run: |
          ssh -T git@github.com || true
      - name: Push to Remote Hub
        run: |
          set -e

          git remote add github \
            ssh://git@github.com/Linktech-Engineering-LLC/RunUpdates.git

          echo "=== Fetching GitHub ==="
          git fetch github main

          LOCAL_HASH=$(git rev-parse HEAD)
          REMOTE_HASH=$(git rev-parse github/main)

          echo "Local HEAD : $LOCAL_HASH"
          echo "Remote HEAD: $REMOTE_HASH"

          #
          # Already synchronized
          #
          if [ "$LOCAL_HASH" = "$REMOTE_HASH" ]; then
              echo "Repositories already synchronized."

          else

              echo
              echo "=== Commits pending on GitHub ==="
              git log --oneline github/main..HEAD || true

              echo
              echo "=== Commits only on GitHub ==="
              git log --oneline HEAD..github/main || true

              echo
              echo "=== File differences ==="
              git diff --stat github/main..HEAD || true

              echo
              echo "=== Fast-forward validation ==="

              if ! git merge --ff-only github/main; then
                  echo "ERROR: GitHub and Forgejo have diverged"
                  git log --oneline --left-right HEAD...github/main
                  exit 1
              fi

              echo
              echo "=== Pushing main ==="
              git push github main

              echo
              echo "=== Verifying push ==="

              git fetch github main

              LOCAL_HASH=$(git rev-parse HEAD)
              REMOTE_HASH=$(git rev-parse github/main)

              echo "Local HEAD : $LOCAL_HASH"
              echo "Remote HEAD: $REMOTE_HASH"

              if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
                  echo "ERROR: Push verification failed"
                  exit 1
              fi

              echo "Push verified successfully."
          fi

          echo
          echo "=== Pushing tags ==="

          for tag in $(git tag -l "v*"); do
              if git ls-remote --tags github | grep -q "refs/tags/$tag$"; then
                  echo "Tag already exists: $tag"
              else
                  echo "Pushing tag: $tag"
                  git push github "$tag"
              fi
          done
