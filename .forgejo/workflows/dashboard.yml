# Company: Linktech Engineering LLC
# Created: 2026-10-21
# Modified: 2026-10-21
# Version: 1.0.0
#
# Description:
#   Generates dashboard content from the nightly build artifact
#   and updates the doug/Pages repository.
#
# Dependencies:
#   workflow_run -> nightly-build
#   workflow_dispatch
#
# Produces:
#   Pages/RunUpdates/*
#
# Consumers:
#   publish.yml

name: create-dashboard

on:
  workflow_run:
    workflows: ["nightly-build"]
    types:
      - completed
  workflow_dispatch:

jobs:
  create:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest
    env:
      GIT_SSH_COMMAND: "ssh -F /github/home/.ssh/config -o IdentitiesOnly=yes"
      FORGEJO_API_ROOT: "http://dad:3000/api/v1/repos/linux/RunUpdates"
      FORGEJO_TOKEN: ${{ secrets.RUNUPDATESTOKEN }}
      FORGEJO_SSH_KEY: ${{ secrets.SSH_PAGES_KEY }}

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.local"

      - name: Download nightly metadata
        run: |
          mkdir -p artifacts

          curl -L \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_ROOT/releases/tags/nightly" \
            -o release.json

      - name: Download release assets
        run: |
          mkdir -p artifacts

          curl -s \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_ROOT/releases/tags/nightly" \
            > release.json

          jq -r '.assets[] | "\(.name)|\(.browser_download_url)"' release.json |
          while IFS='|' read NAME URL; do
            echo "Downloading $NAME"
            curl -L "$URL" -o "artifacts/$NAME"
          done

      - name: Build dashboard folder
        run: |
          mkdir -p dashboard
          cp packaging/dashboard/index.html dashboard/
          cp packaging/dashboard/dashboard.js dashboard/
          cp artifacts/metadata.json dashboard/

          mkdir -p dashboard/artifacts
          cp -r artifacts/RunUpdates* dashboard/artifacts/

          curl -s -o dashboard/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://dad:3000/Linux/RunUpdates/"

      - name: Clone global Pages repo
        run: |
          mkdir -p ~/.ssh
          echo "$FORGEJO_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

          ssh-keyscan -t ed25519 -p 2222 dad >> ~/.ssh/known_hosts

          ssh -T -p 2222 forgejo@dad

          git clone ssh://forgejo@dad:2222/doug/Pages.git pagesrepo
          cd pagesrepo

          mkdir -p RunUpdates
          rm -rf RunUpdates/*
          cp -r ../dashboard/* RunUpdates/

          git config --global user.name "forgejo-actions"
          git config --global user.email "forgejo-actions@noreply.local"

          git add .
          git commit -m "Nightly RunUpdates dashboard update"
          git branch -M main
          git push origin main --force
