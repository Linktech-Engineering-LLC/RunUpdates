name: Forgejo Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: forgejo-nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest
    container:
      image: node:20-bullseye

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure nightly tag exists
        run: |
          if ! git ls-remote --tags origin nightly >/dev/null; then
            echo "Creating nightly tag"
            git tag nightly
            git push origin nightly
          else
            echo "Updating nightly tag to current commit"
            git tag -f nightly
            git push origin nightly --force
          fi

      - name: Capture metadata
        id: capture
        run: |
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          echo "git_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Ensure Python 3.12 is installed
        run: |
          python3 --version
          if [[ "$(python3 -V)" != *"3.12"* ]]; then
            echo "Python 3.12 is required"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc rpm dpkg-dev libarchive-zip-perl

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Install PythonTools
        run: |
          if [ ! -d PythonTools ]; then
            git clone http://dad:3000/dad/linux/PythonTools.git
          fi
          python3 -m pip install PythonTools/

      - name: Make scripts executable
        run: chmod +x packaging/*.sh

      - name: Build all artifacts
        run: ./packaging/build_all.sh

      - name: Normalize RPM filename
        run: |
          OUT=packaging/output
          RPM_SRC=$(find packaging/rpmbuild/RPMS/x86_64 -type f -name "*.rpm" | head -n 1)
          if [[ -n "$RPM_SRC" ]]; then
            ARCH=$(echo "$RPM_SRC" | sed -n 's/.*\.\(.*\)\.rpm/\1/p')
            VERSION=$(basename "$RPM_SRC" | sed -n 's/RunUpdates-\(.*\)-.*\.rpm/\1/p')
            mv "$RPM_SRC" "$OUT/RunUpdates_${VERSION}.${ARCH}.rpm"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packaging/output/RunUpdates_* artifacts/

      - name: Generate metadata.json
        run: |
          mkdir -p artifacts
          PYTHON_VERSION=$(python3 --version | awk '{print $2}')
          PYINSTALLER_VERSION=$(pyinstaller --version 2>/dev/null || echo "unknown")
          BUILDER_OS="forgejo-runner"

          cat > artifacts/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "${{ steps.capture.outputs.build_date }}",
              "commit": "${{ steps.capture.outputs.git_hash }}",
              "branch": "nightly"
            },
            "toolchain": {
              "python": "$PYTHON_VERSION",
              "pyinstaller": "$PYINSTALLER_VERSION",
              "builder_os": "$BUILDER_OS"
            },
            "artifacts": [
          EOF

          FIRST=1
          for f in artifacts/RunUpdates_*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            CRC=$(crc32 "$f")

            case "$NAME" in
              *.deb) TYPE="deb"; OS="linux"; ARCH="amd64";;
              *.rpm) TYPE="rpm"; OS="linux"; ARCH="x86_64";;
              *.zip) TYPE="zip"; OS="windows"; ARCH="x86_64";;
              *.tgz|*.tar.gz) TYPE="tgz"; OS="linux"; ARCH="amd64";;
              *) TYPE="unknown"; OS="unknown"; ARCH="unknown";;
            esac

            if [ $FIRST -eq 0 ]; then
              echo "," >> artifacts/metadata.json
            fi
            FIRST=0

            cat >> artifacts/metadata.json <<EOF
              {
                "name": "$NAME",
                "type": "$TYPE",
                "os": "$OS",
                "arch": "$ARCH",
                "size": $SIZE,
                "sha256": "$SHA",
                "crc32": "$CRC"
              }
          EOF
          done

          cat >> artifacts/metadata.json <<EOF
            ]
          }
          EOF

      - name: Remove existing nightly assets
        run: |
          curl -s -X GET \
            https://dad:3000/api/v1/repos/dad/linux/RunUpdates/releases/nightly \
            | jq -r '.assets[].id' \
            | while read ID; do
                curl -X DELETE \
                  https://dad:3000/api/v1/repos/dad/linux/RunUpdates/releases/assets/$ID
              done

      - name: Upload artifacts to Forgejo nightly release
        run: |
          for f in artifacts