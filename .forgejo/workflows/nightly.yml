name: Forgejo Nightly Build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch:

concurrency:
  group: forgejo-nightly
  cancel-in-progress: true

jobs:

  nightly-build:
    runs-on: ubuntu-latest
    container:
      image: dad:3000/linux/leon-ci:latest

    steps:
      - name: Install Node 20
        run: |
          apt-get update
          apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure nightly tag exists
        run: |
          if ! git ls-remote --tags origin nightly >/dev/null; then
            echo "Creating nightly tag"
            git tag nightly
            git push origin nightly
          else
            echo "Updating nightly tag to current commit"
            git tag -f nightly
            git push origin nightly --force
          fi

      - name: Capture metadata
        id: capture
        run: |
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          echo "git_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure Python 3.12 is installed
        run: |
          python3 --version

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y pandoc rpm dpkg-dev libarchive-zip-perl

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Install PythonTools
        run: |
          if [ ! -d PythonTools ]; then
            git clone http://dad:3000/linux/PythonTools.git
          fi
          python3 -m pip install PythonTools/

      - name: Make scripts executable
        run: chmod +x packaging/*.sh

      - name: Build all artifacts
        run: ./packaging/build_all.sh

      - name: Normalize RPM filename
        run: |
          OUT=packaging/output
          RPM_SRC=$(find packaging/rpmbuild/RPMS/x86_64 -type f -name "*.rpm" | head -n 1)
          if [[ -n "$RPM_SRC" ]]; then
            ARCH=$(echo "$RPM_SRC" | sed -n 's/.*\.\(.*\)\.rpm/\1/p')
            VERSION=$(basename "$RPM_SRC" | sed -n 's/RunUpdates-\(.*\)-.*\.rpm/\1/p')
            mv "$RPM_SRC" "$OUT/RunUpdates_${VERSION}.${ARCH}.rpm"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packaging/output/RunUpdates_* artifacts/

      - name: Generate metadata.json
        run: |
          mkdir -p artifacts
          PYTHON_VERSION=$(python3 --version | awk '{print $2}')
          PYINSTALLER_VERSION=$(pyinstaller --version 2>/dev/null || echo "unknown")
          BUILDER_OS="forgejo-runner"

          cat > artifacts/metadata.json <<EOF
          {
            "meta_version": 2,
            "build": {
              "date": "${{ steps.capture.outputs.build_date }}",
              "commit": "${{ steps.capture.outputs.git_hash }}",
              "branch": "nightly"
            },
            "toolchain": {
              "python": "$PYTHON_VERSION",
              "pyinstaller": "$PYINSTALLER_VERSION",
              "builder_os": "$BUILDER_OS"
            },
            "artifacts": [
          EOF

          FIRST=1
          for f in artifacts/RunUpdates_*; do
            NAME=$(basename "$f")
            SIZE=$(stat -c%s "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            CRC=$(crc32 "$f")

            case "$NAME" in
              *.deb) TYPE="deb"; OS="linux"; ARCH="amd64";;
              *.rpm) TYPE="rpm"; OS="linux"; ARCH="x86_64";;
              *.zip) TYPE="zip"; OS="windows"; ARCH="x86_64";;
              *.tgz|*.tar.gz) TYPE="tgz"; OS="linux"; ARCH="amd64";;
              *) TYPE="unknown"; OS="unknown"; ARCH="unknown";;
            esac

            if [ $FIRST -eq 0 ]; then
              echo "," >> artifacts/metadata.json
            fi
            FIRST=0

            cat >> artifacts/metadata.json <<EOF
              {
                "name": "$NAME",
                "type": "$TYPE",
                "os": "$OS",
                "arch": "$ARCH",
                "size": $SIZE,
                "sha256": "$SHA",
                "crc32": "$CRC"
              }
          EOF
          done

          cat >> artifacts/metadata.json <<EOF
            ]
          }
          EOF

      - name: Ensure nightly release exists
        run: |
          RELEASE=$(curl -s \
            -H "Authorization: token ${{ secrets.RUNUPDATESTOKEN }}" \
            http://dad:3000/api/v1/repos/linux/RunUpdates/releases/nightly \
            | jq -r '.id // empty')

          if [ -z "$RELEASE" ]; then
            echo "Creating nightly release"
            curl -X POST \
              -H "Authorization: token ${{ secrets.RUNUPDATESTOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"tag_name":"nightly","name":"Nightly Build","prerelease":true}' \
              http://dad:3000/api/v1/repos/linux/RunUpdates/releases
          else
            echo "Nightly release already exists"
          fi

      - name: Remove existing nightly assets
        run: |
          RELEASE=$(curl -s \
            -H "Authorization: token ${{ secrets.RUNUPDATESTOKEN }}" \
            http://dad:3000/api/v1/repos/linux/RunUpdates/releases/nightly \
            | jq -r '.id')

          curl -s \
            -H "Authorization: token ${{ secrets.RUNUPDATESTOKEN }}" \
            http://dad:3000/api/v1/repos/linux/RunUpdates/releases/nightly \
            | jq -r '.assets // [] | .[].id' \
            | while read ID; do
                echo "Deleting asset $ID"
                curl -X DELETE \
                  -H "Authorization: token ${{ secrets.RUNUPDATESTOKEN }}" \
                  http://dad:3000/api/v1/repos/linux/RunUpdates/releases/$RELEASE/assets/$ID
              done

      - name: Upload artifacts to Forgejo nightly release
        run: |
          RELEASE=$(curl -s \
            -H "Authorization: token ${{ secrets.RUNUPDATESTOKEN }}" \
            http://dad:3000/api/v1/repos/linux/RunUpdates/releases/nightly \
            | jq -r '.id')

          for f in artifacts/*; do
            echo "Uploading $f"
            curl -X POST \
              -H "Authorization: token ${{ secrets.RUNUPDATESTOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "http://dad:3000/api/v1/repos/linux/RunUpdates/releases/$RELEASE/assets?name=$(basename "$f")"
          done

  publish-dashboard:
    runs-on: ubuntu-latest
    needs: nightly-build

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download nightly artifacts
        uses: actions/download-artifact@v3
        with:
          name: nightly-runupdates
          path: artifacts

      - name: Copy metadata.json to dashboard root
        run: |
          cp artifacts/metadata.json .

      - name: Generate dashboard HTML
        run: |
          META=artifacts/metadata.json

          RELEASE_URL="http://dad:3000/Linux/RunUpdates/releases/download/nightly"

          mkdir -p dashboard
          rm -f dashboard/*

          curl -s -o dashboard/qr.png \
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=http://dad:3000/Linux/RunUpdates/"

          cat > dashboard/index.html <<EOF
          <html>
          <head>
            <title>RunUpdates Nightly Dashboard</title>
            <style>
              body { font-family: Arial; margin: 20px; }
              table { border-collapse: collapse; margin-top: 10px; width: 100%; }
              th, td { padding: 8px 12px; border: 1px solid #ccc; }
              th { background: #f0f0f0; }
              .badge-row img { margin-right: 8px; }
              .download-btn {
                background: #0078d4;
                color: white;
                padding: 6px 12px;
                border-radius: 4px;
                text-decoration: none;
              }
              .download-btn:hover {
                background: #005a9e;
              }
              .qr { margin-top: 20px; }
            </style>
          </head>
          <body>

          <h1>RunUpdates Nightly Dashboard</h1>

          <div class="badge-row">
            <img src="https://img.shields.io/badge/version-loading-blue" id="version-badge">
            <img src="https://img.shields.io/badge/date-loading-lightgrey" id="date-badge">
            <img src="https://img.shields.io/badge/python-loading-yellow" id="python-badge">
            <img src="https://img.shields.io/badge/pyinstaller-loading-orange" id="pyi-badge">
          </div>

          <h2>Build Metadata</h2>
          <div id="build-info"></div>

          <h2>Artifacts</h2>
          <div id="artifact-table"></div>

          <div class="qr">
            <h2>QR Code</h2>
            <img src="qr.png" alt="QR Code">
          </div>

          <script src="dashboard.js"></script>
          </body>
          </html>
          EOF

      - name: Restore dashboard.js
        run: |
          if [ -f dashboard.js.bak ]; then
            mv dashboard.js.bak dashboard.js
          fi

      - name: Publish dashboard to gh-pages
        env:
          FORGEJO_TOKEN: ${{ secrets.RUNUPDATESTOKEN }}
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.local"

          cp -r dashboard/* .

          git add .
          git commit -m "Update nightly dashboard" || echo "No changes"
          git push origin gh-pages
